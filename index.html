<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="山間小站 — Python · 算法 · 数据科学 · 人工智能">
  <title>山间小站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- Reading progress bar -->
  <div class="progress-bar" id="progressBar"></div>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="#" class="logo">山間小站</a>
      <button class="menu-toggle" aria-label="导航菜单">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links">
        <a href="#home">首頁</a>
        <a href="#posts">文章</a>
        <a href="#about">關於</a>
      </nav>
      <button class="theme-toggle" aria-label="切换主题">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section id="home" class="hero reveal">
      <div class="container">
        <h1>山間小站</h1>
        <p class="subtitle">Python · 算法 · 数据科学 · 人工智能</p>
        <div class="divider"></div>
      </div>
    </section>

    <!-- Posts -->
    <section id="posts" class="posts-section">
      <div class="container">
        <h2 class="section-title reveal">文章</h2>
        <div class="posts-grid" id="postsContainer">
          <!-- dynamically loaded from posts.json -->
        </div>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="about-section">
      <div class="container">
        <div class="divider"></div>
        <h2 class="section-title reveal">關於</h2>
        <div class="about-content reveal">
          <p>你好，我是一名专注 Python 与 AI 的开发者。</p>
          <p>痴迷于算法之美、数据之道，从爬虫到深度学习，从模型训练到 Agent 落地，享受用代码探索世界的每一刻。</p>
          <p>这个博客记录我的技术思考与实践，愿与你一同成长。</p>
        </div>
        <div class="divider"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container reveal">
      <div class="social-links">
        <a href="https://github.com" target="_blank" rel="noopener" title="GitHub">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.73.083-.73 1.205.085 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.762-1.604-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/></svg>
        </a>
        <a href="mailto:hi@example.com" title="Email">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </a>
        <a href="#" title="RSS">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18zM4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44zm0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93v-2.83z"/></svg>
        </a>
      </div>
      <p>&copy; 2026 山間小站</p>
    </div>
  </footer>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="回到顶部">↑</button>

  <!-- Corgi Widget -->
  <div class="corgi-widget" id="corgiWidget">
    <button class="corgi" id="corgiBtn" aria-label="柯基挂件">
      <div class="corgi-ear corgi-ear-left"></div>
      <div class="corgi-ear corgi-ear-right"></div>
      <div class="corgi-face">
        <div class="corgi-eye corgi-eye-left"></div>
        <div class="corgi-eye corgi-eye-right"></div>
        <div class="corgi-nose"></div>
        <div class="corgi-mouth"></div>
        <div class="corgi-blush corgi-blush-left"></div>
        <div class="corgi-blush corgi-blush-right"></div>
      </div>
      <div class="corgi-body">
        <div class="corgi-paw corgi-paw-left"></div>
        <div class="corgi-paw corgi-paw-right"></div>
      </div>
      <div class="corgi-tail"></div>
    </button>

    <div class="widget-panel" id="widgetPanel">
      <div class="panel-clock">
        <span class="clock-time" id="clockTime">00:00:00</span>
        <span class="clock-date" id="clockDate"></span>
      </div>
      <div class="panel-actions">
        <button class="panel-btn" id="panelThemeToggle">
          <span class="panel-icon-sun">☀️</span>
          <span class="panel-icon-moon">🌙</span>
          <span class="panel-btn-text">切換主題</span>
        </button>
        <button class="panel-btn" id="panelTop">
          <span>⬆</span>
          <span class="panel-btn-text">回到頂部</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Article detail modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-container" id="modalContainer">
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
